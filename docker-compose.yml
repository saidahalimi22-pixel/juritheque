version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: juritheque_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: juritheque
      POSTGRES_PASSWORD: juritheque_secret_2025
      POSTGRES_DB: juritheque
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_categories.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juritheque -d juritheque"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Adminer for easy database management in browser
  adminer:
    image: adminer:latest
    container_name: juritheque_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
