<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | المرصد المغربي</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0A2540, #1E3A5F);
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-card h1 {
      color: #0A2540;
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.6rem;
    }
    .login-card .subtitle {
      text-align: center;
      color: #6B7280;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .login-card .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .login-card .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #C9A84C, #A88B2E);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #0A2540;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #0A2540;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus { border-color: #C9A84C; }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #C9A84C;
      color: #0A2540;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-login:hover { background: #E8D48B; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: #FEE2E2;
      color: #991B1B;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #9CA3AF;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-card">
    <div class="logo"><img src="../logo-emblem.png" alt="" style="width:84px;height:84px"></div>
    <h1 style="font-size:1.25rem;line-height:1.5">المرصد المغربي للدراسات والأبحاث القانونية</h1>
    <p class="subtitle">لوحة تحكم المنصة القانونية</p>

    <div class="error-msg" id="error"></div>

    <form id="login-form">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="البريد الإلكتروني" autocomplete="username">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btn">دخول</button>
    </form>

    
  </div>

  <script src="js/api.js"></script>
  <script>
    // إذا كان مسجلاً مسبقاً → لوحة التحكم
    if (api.getToken() && api.getUser()) {
      window.location.href = 'index.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';

      try {
        const data = await api.post('/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        api.setAuth(data.token, data.user);
        window.location.href = 'index.html';
      } catch (err) {
        errorEl.textContent = err.message || 'فشل تسجيل الدخول';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'دخول';
      }
    });
  </script>
</body>
</html>
