<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة القوانين | Jurithèque</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="logo-icon">J</div> Jurithèque</div>
    <nav class="sidebar-nav">
      <a href="index.html"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
      <div class="sidebar-section">المحتوى</div>
      <a href="laws.html" class="active"><i class="fas fa-balance-scale"></i> مدونة القوانين</a>
      <a href="jurisprudence.html"><i class="fas fa-gavel"></i> الاجتهادات القضائية</a>
      <a href="books.html"><i class="fas fa-book"></i> الكتب</a>
      <a href="theses.html"><i class="fas fa-graduation-cap"></i> الرسائل والأطروحات</a>
      <a href="articles.html"><i class="fas fa-newspaper"></i> المقالات</a>
      <a href="reports.html"><i class="fas fa-file-alt"></i> التقارير</a>
      <a href="lectures.html"><i class="fas fa-chalkboard-teacher"></i> المحاضرات</a>
      <a href="announcements.html"><i class="fas fa-bullhorn"></i> الإعلانات</a>
      <div class="sidebar-section">النظام</div>
      <a href="categories.html"><i class="fas fa-folder"></i> التصنيفات</a>
      <a href="users.html"><i class="fas fa-users"></i> المستخدمون</a>
      <a href="../index.html"><i class="fas fa-external-link-alt"></i> عرض الموقع</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>إدارة مدونة القوانين</h1>
      <div class="topbar-actions">
        <div class="user-info"></div>
        <button class="btn btn-primary" onclick="openForm()">
          <i class="fas fa-plus"></i> إضافة قانون
        </button>
      </div>
    </div>

    <div class="content">
      <div class="card" id="form-card" style="display:none;">
        <div class="card-header">
          <h2 id="form-title">إضافة قانون جديد</h2>
          <button class="btn btn-sm btn-outline" onclick="closeForm()">إغلاق</button>
        </div>
        <div class="card-body">
          <form id="law-form">
            <input type="hidden" id="law-id">
            <div class="form-grid">
              <div class="form-group full">
                <label>عنوان القانون *</label>
                <input type="text" id="title" required placeholder="الأمر رقم ... المتضمن ...">
              </div>
              <div class="form-group">
                <label>الرقم الرسمي</label>
                <input type="text" id="officialNumber" placeholder="75-58">
              </div>
              <div class="form-group">
                <label>تاريخ النشر</label>
                <input type="date" id="publicationDate">
              </div>
              <div class="form-group">
                <label>تاريخ آخر تعديل</label>
                <input type="date" id="lastAmendmentDate">
              </div>
              <div class="form-group">
                <label>الحالة القانونية</label>
                <select id="status">
                  <option value="sari">ساري المفعول</option>
                  <option value="muaddal">معدل</option>
                  <option value="mutammam">متمم</option>
                  <option value="mulgha">ملغى</option>
                </select>
              </div>
              <div class="form-group">
                <label>حالة النشر</label>
                <select id="statusDoc">
                  <option value="published">منشور</option>
                  <option value="draft">مسودة</option>
                </select>
              </div>
              <div class="form-group full">
                <label>ملخص</label>
                <textarea id="summary" rows="3"></textarea>
              </div>
              <div class="form-group">
                <label>رابط المصدر الرسمي</label>
                <input type="url" id="sourceUrl" placeholder="https://...">
              </div>
              <div class="form-group">
                <label>رابط ملف PDF</label>
                <input type="url" id="fileUrl" placeholder="https://...">
              </div>
              <div class="form-group">
                <label>أو ارفع ملف PDF</label>
                <input type="file" id="law-file" accept=".pdf,application/pdf">
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="save-btn"><i class="fas fa-save"></i> حفظ</button>
              <button type="button" class="btn btn-outline" onclick="closeForm()">إلغاء</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>قائمة القوانين</h2>
          <span id="total-count" style="color:#6B7280;font-size:0.9rem"></span>
        </div>
        <div class="card-body">
          <div class="filters">
            <input type="text" id="search-q" placeholder="بحث...">
            <button class="btn btn-outline" onclick="loadLaws()"><i class="fas fa-search"></i> بحث</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>العنوان</th>
                <th>الرقم</th>
                <th>الحالة</th>
                <th>النشر</th>
                <th>التاريخ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="laws-tbody">
              <tr><td colspan="6" style="text-align:center;color:#9CA3AF;">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth(['admin', 'editor']);
    renderUserBar();

    const statusLabels = { sari: 'ساري', muaddal: 'معدل', mutammam: 'متمم', mulgha: 'ملغى' };
    const statusBadge = { sari: 'success', muaddal: 'info', mutammam: 'info', mulgha: 'danger' };

    async function loadLaws() {
      const tbody = document.getElementById('laws-tbody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">جاري التحميل...</td></tr>';
      try {
        const q = document.getElementById('search-q').value.trim();
        let url = '/laws?limit=50';
        if (q) url += '&q=' + encodeURIComponent(q);
        const res = await api.get(url);
        document.getElementById('total-count').textContent = (res.meta?.total || 0) + ' قانون';
        if (!res.data?.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#9CA3AF;">لا توجد نتائج</td></tr>';
          return;
        }
        tbody.innerHTML = res.data.map(function(law) {
          return '<tr>' +
            '<td>' + escapeHtml(law.title) + '</td>' +
            '<td>' + escapeHtml(law.officialNumber || '—') + '</td>' +
            '<td><span class="badge badge-' + (statusBadge[law.status] || 'info') + '">' + (statusLabels[law.status] || law.status) + '</span></td>' +
            '<td><span class="badge badge-' + (law.statusDoc === 'published' ? 'success' : 'warning') + '">' + (law.statusDoc === 'published' ? 'منشور' : 'مسودة') + '</span></td>' +
            '<td>' + (law.publicationDate ? law.publicationDate.substring(0, 10) : '—') + '</td>' +
            '<td>' +
              '<button class="btn btn-sm btn-outline" data-id="' + law.id + '" onclick="editById(this.dataset.id)"><i class="fas fa-edit"></i></button> ' +
              '<button class="btn btn-sm btn-outline" style="color:#EF4444" onclick="deleteLaw(\'' + law.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</td></tr>';
        }).join('');
        window._lawsCache = res.data;
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="color:#EF4444;text-align:center;">' + err.message + '</td></tr>';
      }
    }

    function openForm(law) {
      document.getElementById('form-card').style.display = 'block';
      document.getElementById('form-title').textContent = law ? 'تعديل قانون' : 'إضافة قانون جديد';
      document.getElementById('law-id').value = law ? law.id : '';
      document.getElementById('title').value = law ? law.title : '';
      document.getElementById('officialNumber').value = law && law.officialNumber ? law.officialNumber : '';
      document.getElementById('publicationDate').value = law && law.publicationDate ? law.publicationDate.substring(0, 10) : '';
      document.getElementById('lastAmendmentDate').value = law && law.lastAmendmentDate ? law.lastAmendmentDate.substring(0, 10) : '';
      document.getElementById('status').value = law ? law.status : 'sari';
      document.getElementById('statusDoc').value = law ? law.statusDoc : 'published';
      document.getElementById('summary').value = law && law.summary ? law.summary : '';
      document.getElementById('sourceUrl').value = law && law.sourceUrl ? law.sourceUrl : '';
      document.getElementById('fileUrl').value = law && law.fileUrl ? law.fileUrl : '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeForm() {
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('law-form').reset();
      document.getElementById('law-id').value = '';
    }

    function editById(id) {
      const law = (window._lawsCache || []).find(function(l) { return l.id === id; });
      if (law) openForm(law);
    }

    async function deleteLaw(id) {
      if (!confirm('هل أنت متأكد من حذف هذا القانون؟')) return;
      try {
        await api.delete('/laws/' + id);
        showAlert('تم الحذف بنجاح');
        loadLaws();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    document.getElementById('law-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
      
      // رفع ملف إن وُجد
      const fileEl = document.getElementById('law-file');
      if (fileEl && fileEl.files && fileEl.files[0]) {
        const fd = new FormData();
        fd.append('file', fileEl.files[0]);
        const token = api.getToken();
        const API_BASE = localStorage.getItem('API_BASE') || 'http://localhost:4000/api';
        const upRes = await fetch(API_BASE + '/upload', {
          method: 'POST',
          headers: token ? { Authorization: 'Bearer ' + token } : {},
          body: fd
        });
        const upData = await upRes.json();
        if (!upRes.ok) throw new Error(upData.error || 'فشل رفع الملف');
        document.getElementById('fileUrl').value = upData.path || upData.url;
      }

      const id = document.getElementById('law-id').value;
      const payload = {
        title: document.getElementById('title').value.trim(),
        officialNumber: document.getElementById('officialNumber').value.trim() || null,
        publicationDate: document.getElementById('publicationDate').value || null,
        lastAmendmentDate: document.getElementById('lastAmendmentDate').value || null,
        status: document.getElementById('status').value,
        statusDoc: document.getElementById('statusDoc').value,
        summary: document.getElementById('summary').value.trim() || null,
        sourceUrl: document.getElementById('sourceUrl').value.trim() || null,
        fileUrl: document.getElementById('fileUrl').value.trim() || null
      };
      try {
        if (id) {
          await api.put('/laws/' + id, payload);
          showAlert('تم التحديث بنجاح');
        } else {
          await api.post('/laws', payload);
          showAlert('تم الإضافة بنجاح');
        }
        closeForm();
        loadLaws();
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadLaws();
  </script>
</body>
</html>
